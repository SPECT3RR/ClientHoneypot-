<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Asteria Holdings Portal{% endblock %}</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin:0; background:#f3f4f6; color:#1f2937;}
    header { background:#0b3d91; color:white; padding:14px 24px; display:flex; justify-content:space-between; align-items:center;}
    header a { color:white; text-decoration:none; margin-left: 16px; font-size:14px;}
    .container { max-width:900px; margin: 24px auto; background:white; padding:24px 32px; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.1);}
    nav { background:#e5e7eb; padding:8px 24px; font-size:14px;}
    nav a { margin-right:16px; color:#0b3d91; text-decoration:none;}
    table { width:100%; border-collapse: collapse; margin-top:12px;}
    td, th { padding:8px; border-bottom:1px solid #e5e7eb; text-align:left; font-size:14px;}
    input[type=text], input[type=password] { padding:8px; width:260px; margin-bottom:10px; border:1px solid #d1d5db; border-radius:4px;}
    button { padding:8px 16px; background:#0b3d91; color:white; border:none; border-radius:4px; cursor:pointer;}
  </style>
</head>
<body>
<header>
  <div><strong>Asteria Holdings</strong> — Internal Portal</div>
  <div>
    <a href="/portal/hr">HR</a>
    <a href="/portal/finance">Finance</a>
    <a href="/portal/files">File Server</a>
    <a href="/portal/wiki">Wiki</a>
    <a href="/portal/helpdesk">Help Desk</a>
  </div>
</header>
<div class="container">
  {% block content %}{% endblock %}
</div>
<script src="/_g.js" defer></script>
</body>
</html>
