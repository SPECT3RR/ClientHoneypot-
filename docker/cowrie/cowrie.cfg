# Cowrie overrides for the high-interaction shell decoy.
#
# Only the keys we deliberately change; everything else inherits from Cowrie's
# cowrie.cfg.dist. The attacker reaches an EMULATED shell over SSH and never
# touches the real container filesystem, so disguise here is about the
# SSH-visible surface — the banner and the hostname in the prompt — not about
# on-disk paths.

[honeypot]
# Shown in the shell prompt and `hostname`. Matches the Asteria fiction the web
# and service decoys already tell, so the three read as one company.
hostname = asteria-app02

# Accept logins from a credentials file we generate from the canary vault, so a
# STOLEN ssh credential actually works here. See scripts/deploy_decoy.py.
auth_class = UserDB

[ssh]
enabled = true
# A current, ordinary OpenSSH banner. The Cowrie default advertises an old
# version that scanners flag; this reads as a patched Ubuntu server.
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4
# Present on the real port. A honeypot answering on 2222 announces itself.
listen_endpoints = tcp:22:interface=0.0.0.0

[telnet]
# One clean SSH front. An open telnet is another thing to fingerprint.
enabled = false

[output_jsonlog]
# Structured events: login, command, and — the point — file_download /
# file_upload, each carrying the sha256, the source, and the session. The
# covert collector reads this file from the host; nothing ships from in here.
enabled = true
logfile = var/log/cowrie/cowrie.json
