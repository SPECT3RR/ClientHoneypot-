# Layered containment for live hunting.
#
#   Windows host
#   └── WSL2 utility VM              <- the actual security boundary
#       ├── hunt_net    : internet-facing, inter-container talk disabled
#       └── decoy_net   : internal only, no route off the host
#
# The two networks are the point. A payload that compromises a hunter must not
# reach the LAN, and the decoy must not reach the internet — a decoy that can
# phone out is an attacker's relay.
#
# Ports bind to 127.0.0.1 only. Exposing the decoy to the internet is a
# deliberate, separate act (see README: use a tunnel that terminates outside
# your perimeter), never a side effect of `docker compose up`.

services:

  # Web decoy: the human who used a leaked portal credential lands here.
  decoy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "decoy_app/app.py"]
    networks: [decoy_net]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ../telemetry:/app/telemetry
    restart: unless-stopped

  # Service decoy: the attacker who exfiltrated our SSH key, DB password or
  # FTP login lands here — and the login WORKS, because the config is
  # generated from the same canary vault that planted the credential.
  #
  # Without this the bait has a dead end: connection refused teaches the
  # attacker the credentials are stale and they never return.
  decoy-services:
    build:
      context: ..
      dockerfile: docker/Dockerfile.honeypots
    image: clienthoneypot/decoy-services:latest
    networks: [decoy_net]
    volumes:
      - ../telemetry/honeypots:/var/log/honeypots
      - ../config/honeypots:/etc/honeypots:ro
    # Bound to loopback only. Exposing these to the internet is a separate,
    # deliberate act via a tunnel that terminates outside your perimeter.
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:2121:21"
      - "127.0.0.1:33060:3306"
      - "127.0.0.1:54320:5432"
      - "127.0.0.1:4445:445"
      - "127.0.0.1:5901:5900"
      - "127.0.0.1:33890:3389"
      - "127.0.0.1:63790:6379"
      - "127.0.0.1:2323:23"
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "dashboard/app.py"]
    networks: [decoy_net, hunt_net]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../telemetry:/app/telemetry
      - ../reports:/app/reports
    depends_on: [decoy]
    restart: unless-stopped

  # Hunting workers are launched per session by src/substrate.py rather than
  # declared here: each needs its own throwaway container, profile, and bait.
  # This entry exists to build and tag the image.
  hunter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: clienthoneypot/hunter:latest
    networks: [hunt_net]
    profiles: ["manual"]          # never started by `up`
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    shm_size: 1gb                 # Chromium crashes on the 64 MB default

networks:
  hunt_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  decoy_net:
    driver: bridge
    internal: true                # no route off the host at all
