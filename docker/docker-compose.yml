# Layered containment for live hunting.
#
#   Windows host
#   └── WSL2 utility VM              <- the actual security boundary
#       ├── hunt_net    : internet-facing, inter-container talk disabled
#       └── decoy_net   : internal only, no route off the host
#
# The two networks are the point. A payload that compromises a hunter must not
# reach the LAN, and the decoy must not reach the internet — a decoy that can
# phone out is an attacker's relay.
#
# Ports bind to 127.0.0.1 only. Exposing the decoy to the internet is a
# deliberate, separate act (see README: use a tunnel that terminates outside
# your perimeter), never a side effect of `docker compose up`.

# !! THE DECOYS ARE NOT STARTED FROM THIS FILE. !!
#
#     python scripts/deploy_decoy.py
#
# They are declared here to build and tag their images, and nothing more. Two
# reasons, both learned the hard way:
#
# 1. This file used to declare `internal: true` on a decoy_net that already
#    existed, created by hand. Docker does not retrofit that onto an existing
#    network, so the flag sat here reading as containment while the decoy had
#    full egress to the internet and the host. A declaration compose will not
#    enforce is worse than no declaration. deploy_decoy.py builds the network
#    to spec and then attacks it from the inside to prove it.
#
# 2. The decoys take their config by `docker cp` rather than a mount, because
#    a mount is visible in /proc/mounts and ours announced that the host was a
#    Windows machine with the operator's D: drive attached. Compose has no way
#    to place a file without mounting it.
#
# Consequence worth knowing: an internal network cannot publish ports either,
# so the decoys are reachable only from decoy_net, which is where hunted
# sessions live. There is no host-side door. Exposing a decoy to real traffic
# is a separate, deliberate act via a tunnel that terminates outside your
# perimeter.

services:

  # Web decoy: the human who used a leaked portal credential lands here.
  # Built here, deployed by scripts/deploy_decoy.py.
  decoy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: clienthoneypot/hunter:latest
    profiles: ["manual"]          # never started by `up`

  # Service decoy: the attacker who exfiltrated our SSH key, DB password or
  # FTP login lands here — and the login WORKS, because the config is
  # generated from the same canary vault that planted the credential.
  #
  # Without this the bait has a dead end: connection refused teaches the
  # attacker the credentials are stale and they never return.
  # Built here, deployed by scripts/deploy_decoy.py.
  decoy-services:
    build:
      context: ..
      dockerfile: docker/Dockerfile.honeypots
    image: clienthoneypot/decoy-services:latest
    profiles: ["manual"]          # never started by `up`

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "dashboard/app.py"]
    networks: [decoy_net, hunt_net]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../telemetry:/app/telemetry
      - ../reports:/app/reports
    # No depends_on: the decoys are deployed by scripts/deploy_decoy.py, and
    # the dashboard is useful without them.
    restart: unless-stopped

  # Hunting workers are launched per session by src/substrate.py rather than
  # declared here: each needs its own throwaway container, profile, and bait.
  # This entry exists to build and tag the image.
  hunter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: clienthoneypot/hunter:latest
    networks: [hunt_net]
    profiles: ["manual"]          # never started by `up`
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    shm_size: 1gb                 # Chromium crashes on the 64 MB default

networks:
  hunt_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  decoy_net:
    driver: bridge
    internal: true                # no route off the host at all
